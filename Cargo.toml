[package]
name = "codexusage"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
  ".",
  "xtask",
]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
chrono = { version = "0.4.40", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10.1"
color-eyre = "0.6.3"
dirs = "6.0.0"
eyre = "0.6.12"
reqwest = { version = "0.12.14", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
filetime = "0.2.25"
tempfile = "3.18.0"

[[bench]]
name = "scan"
harness = false
