[package]
name = "codexusage"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Fast CLI reports for OpenAI Codex session usage and cost"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Szpadel/codexusage"
homepage = "https://github.com/Szpadel/codexusage"
documentation = "https://docs.rs/codexusage"
keywords = ["codex", "openai", "cli", "usage", "jsonl"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
resolver = "2"
members = [
  ".",
  "xtask",
]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10.4"
color-eyre = "0.6.5"
ctrlc = "3.5.2"
dirs = "6.0.0"
eyre = "0.6.12"
memchr = "2.7.6"
notify = "8.2.0"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
terminal_size = "0.4.4"
zstd = "0.13.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["term"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
filetime = "0.2.27"
tempfile = "3.27.0"

[[bench]]
name = "scan"
harness = false
